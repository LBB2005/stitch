name: Stitch
options:
  bundleIdPrefix: com.liamblackshawbrown
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Personal use only: signed with the local "Flow Dev" identity so notification and login-item
    # grants survive rebuilds. Change to "-" for plain ad-hoc signing.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Flow Dev"
    DEVELOPMENT_TEAM: ""

targets:
  Stitch:
    type: application
    platform: macOS
    sources:
      - path: Stitch
        excludes:
          - "Engine/MuPDF/module.modulemap"
    info:
      path: Stitch/Resources/Info.plist
      properties:
        CFBundleDisplayName: Stitch
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        # PDFs can be opened in Stitch (double-click once it's the default, Open With, the Dock). Alternate
        # rank: Stitch never takes over PDFs until it's chosen in Settings.
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        # Finder → right-click → Services → Sign or Edit with Stitch.
        NSServices:
          - NSMenuItem: { default: Sign or Edit with Stitch }
            NSMessage: signOrEditPDF
            NSPortName: Stitch
            NSSendFileTypes: [com.adobe.pdf]
        NSHumanReadableCopyright: "© 2026 Liam Blackshaw-Brown"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liamblackshawbrown.Stitch
        PRODUCT_NAME: Stitch
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO   # not notarized; hardened runtime blocks the test bundle from loading
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        # MuPDF (vendor/mupdf, built by scripts/build-mupdf.sh) is linked statically, only through the C
        # shim in Stitch/Engine/MuPDF.
        HEADER_SEARCH_PATHS: "$(SRCROOT)/vendor/mupdf/include"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Stitch/Engine/MuPDF"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/build/mupdf/lib"
        OTHER_LDFLAGS: "-lmupdf -lmupdf-third"

  StitchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StitchTests
    dependencies:
      - target: Stitch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liamblackshawbrown.StitchTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Stitch.app/Contents/MacOS/Stitch"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Stitch/Engine/MuPDF"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/vendor/mupdf/include"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Stitch:
    build:
      targets:
        Stitch: all
        StitchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StitchTests
