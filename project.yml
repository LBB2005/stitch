name: Stitch
options:
  bundleIdPrefix: com.liamblackshawbrown
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Personal use only: signed with the local "Flow Dev" identity so notification and login-item
    # grants survive rebuilds. Change to "-" for plain ad-hoc signing.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Flow Dev"
    DEVELOPMENT_TEAM: ""

targets:
  Stitch:
    type: application
    platform: macOS
    sources:
      - path: Stitch
    info:
      path: Stitch/Resources/Info.plist
      properties:
        CFBundleDisplayName: Stitch
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Liam Blackshaw-Brown"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liamblackshawbrown.Stitch
        PRODUCT_NAME: Stitch
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO   # not notarized; hardened runtime blocks the test bundle from loading
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES

  StitchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StitchTests
    dependencies:
      - target: Stitch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liamblackshawbrown.StitchTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Stitch.app/Contents/MacOS/Stitch"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Stitch:
    build:
      targets:
        Stitch: all
        StitchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StitchTests
